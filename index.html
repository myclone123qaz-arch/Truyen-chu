<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Tủ Truyện Cá Nhân</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    /* Tùy chỉnh font chữ và độ rộng khung đọc cho đỡ mỏi mắt */
    .markdown-section {
      max-width: 800px;
      font-size: 18px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="app">Đang tải truyện...</div>
  <script>
    window.$docsify = {
      name: 'Tủ Truyện Của Tôi',
      loadSidebar: true,     // Bật thanh mục lục bên trái
      subMaxLevel: 2,        // Tự động nhận diện tiêu đề phụ
      auto2top: true,        // Tự động cuộn lên đầu trang khi chuyển chương
      search: {
        placeholder: 'Tìm tên truyện hoặc chương...',
        noData: 'Không tìm thấy kết quả!'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
